<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapper3D viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101014; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    canvas.dragging { cursor: grabbing; }
    #bar { position: fixed; top: 8px; left: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           background: #000a; padding: 6px 10px; border-radius: 6px; }
    #info { position: fixed; bottom: 8px; left: 8px; background: #000a; padding: 6px 10px; border-radius: 6px; white-space: pre; }
    #preview { position: fixed; bottom: 8px; right: 8px; }
    #preview video { display: block; width: min(40vw, 320px); border-radius: 6px; border: 1px solid #fff4; }
    label { cursor: pointer; user-select: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="bar">
    <label>Model <input type="file" id="file" accept=".json"></label>
    <label>Scan video <input type="file" id="video" accept="video/*"></label>
    <button id="webcam">Scan with camera</button>
    <button id="stop" hidden>Stop and reconstruct</button>
    <label id="exposureBox" hidden>Exposure <input type="range" id="exposure" step="0.1"> <span id="exposureValue"></span> EV</label>
    <label><input type="checkbox" id="lines" checked> string</label>
    <label><input type="checkbox" id="labels" checked> indices</label>
    <label><input type="checkbox" id="cameras" checked> camera path</label>
    <label><input type="checkbox" id="chase"> chase animation</label>
  </div>
  <div id="info">Open a model.json made by scripts/reconstruct-video.js (or drop it here). Drag to rotate, wheel to zoom, shift-drag to pan.</div>
  <div id="preview"></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
